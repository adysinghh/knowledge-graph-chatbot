version: "3.8"
services:
  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - backend/.env
    depends_on:
      - neo4j
    ports:
      - "8001:8000"      # ← external 8001 → internal 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3001:3000"      # ← external 3001 → internal 3000

volumes:
  neo4j_data:
